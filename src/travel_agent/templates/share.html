{% extends "base.html" %}
{% block title %}分享的行程 · 小T{% endblock %}
{% block head %}
  <meta name="robots" content="noindex"/>
  <script src="/static/vendor/leaflet.js"></script>
  <link rel="stylesheet" href="/static/vendor/leaflet.css" />
  <script src="/static/vendor/echarts.min.js"></script>
{% endblock %}
{% block body %}
<div x-data="shareApp('{{ token }}')" class="share-body">
  <header class="share-topbar sticky top-0 z-40 h-14 flex items-center justify-between px-5">
    <div class="flex items-center gap-2.5">
      <img src="/static/img/logo/logo_round.png" alt="小T"
        class="w-8 h-8 rounded-full object-cover shadow-lift" />
      <span class="font-semibold text-[15px]" style="color: var(--pj-ink)">小T</span>
      <span class="text-xs hidden sm:inline" style="color: var(--pj-ink-3)">分享的行程（只读）</span>
    </div>
    <a href="/" class="text-xs hover:underline" style="color: var(--pj-ink-2)">我也要规划</a>
  </header>

  <div class="share-shell">
    <template x-if="loading">
      <div class="text-center py-20" style="color: var(--pj-ink-3)">
        <div class="typing-dots flex gap-1.5 justify-center mb-3"><span></span><span></span><span></span></div>
        正在打开分享内容…
      </div>
    </template>

    <template x-if="error">
      <div class="text-center py-20">
        <div class="text-4xl mb-3">🔗</div>
        <p class="mb-3" style="color: var(--pj-ink-2)" x-text="error"></p>
        <a href="/" class="text-sm hover:underline" style="color: var(--pj-amber)">去规划自己的旅行</a>
      </div>
    </template>

    <template x-if="snapshot">
      <div class="sheet sheet-pad">
        <div class="sheet-hero">
          <div>
            <h1 class="sheet-hero-title" x-text="snapshot.plan.destination"></h1>
            <p class="sheet-hero-meta"
               x-text="snapshot.plan.start_date + ' ~ ' + snapshot.plan.end_date + ' · ' + snapshot.plan.travelers + ' 人'"></p>
          </div>
          <div class="sheet-hero-cost">
            <p class="sheet-hero-pp">人均约 ¥<span x-text="snapshot.plan.per_person_cost_cny"></span></p>
            <p class="sheet-hero-total">总花费 ¥<span x-text="snapshot.plan.total_cost_cny"></span></p>
          </div>
        </div>
        <div class="sheet-days">
          <template x-for="day in snapshot.plan.days" :key="day.day_index">
            <div>
              <div class="sheet-day-head">
                <span class="sheet-day-num" x-text="day.day_index"></span>
                <span class="sheet-day-date" x-text="day.date"></span>
              </div>
              <div class="sheet-timeline">
                <template x-for="item in day.items" :key="item.item_id">
                  <div class="sheet-item">
                    <div class="sheet-item-row">
                      <span class="sheet-item-time"
                        x-text="item.start_time ? item.start_time.slice(0,5) : '·'"></span>
                      <div class="sheet-item-main">
                        <div class="sheet-item-title" x-text="item.title"></div>
                        <p class="sheet-item-note" x-show="item.notes" x-text="item.notes"></p>
                      </div>
                      <span class="sheet-item-cost" x-show="item.cost_cny">¥<span x-text="item.cost_cny"></span></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="snapshot">
      <div class="sheet-grid">
        <div class="sheet sheet-overflow">
          <div class="sheet-head">
            <span>行程路线地图</span>
            <span class="sheet-note">真实地理坐标，悬停节点查看地点</span>
          </div>
          <div id="route" class="share-map"></div>
        </div>
        <div class="sheet sheet-overflow">
          <div class="sheet-head">费用分布</div>
          <div id="cost-chart" class="share-chart"></div>
        </div>
      </div>
    </template>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/share.js?v=6"></script>
{% endblock %}
