{% extends "base.html" %}
{% block title %}分享的行程 · 小T{% endblock %}
{% block head %}
  <meta name="robots" content="noindex"/>
  <script src="/static/vendor/echarts.min.js"></script>
{% endblock %}
{% block body %}
<div x-data="shareApp('{{ token }}')">
  <header class="h-14 flex items-center justify-between px-5 bg-white/80 backdrop-blur border-b border-black/5">
    <div class="flex items-center gap-2.5">
      <img src="/static/img/logo/logo_round.png" alt="小T"
        class="w-8 h-8 rounded-full object-cover shadow-lift" />
      <span class="font-semibold text-[15px]">小T</span>
      <span class="text-xs text-ink-300 hidden sm:inline">分享的行程（只读）</span>
    </div>
    <a href="/" class="text-xs text-ink-500 hover:text-brand-600">我也要规划</a>
  </header>

  <div class="max-w-3xl mx-auto px-4 py-6 space-y-4">
    <template x-if="loading">
      <div class="text-center text-ink-400 py-20">
        <div class="typing-dots flex gap-1.5 justify-center mb-3"><span></span><span></span><span></span></div>
        正在打开分享内容…
      </div>
    </template>

    <template x-if="error">
      <div class="text-center py-20">
        <div class="text-4xl mb-3">🔗</div>
        <p class="text-ink-500 mb-3" x-text="error"></p>
        <a href="/" class="text-sm text-brand-600 hover:underline">去规划自己的旅行</a>
      </div>
    </template>

    <template x-if="snapshot">
      <div class="bg-white rounded-2xl border border-black/5 shadow-soft p-6">
        <div class="flex items-start justify-between gap-4 mb-5">
          <div>
            <h1 class="text-xl font-bold" x-text="snapshot.plan.destination"></h1>
            <p class="text-sm text-ink-500 mt-1"
               x-text="snapshot.plan.start_date + ' ~ ' + snapshot.plan.end_date + ' · ' + snapshot.plan.travelers + ' 人'"></p>
          </div>
          <div class="text-right shrink-0">
            <p class="text-lg font-bold text-brand-600">人均约 ¥<span x-text="snapshot.plan.per_person_cost_cny"></span></p>
            <p class="text-xs text-ink-400">总花费 ¥<span x-text="snapshot.plan.total_cost_cny"></span></p>
          </div>
        </div>
        <div class="space-y-5">
          <template x-for="day in snapshot.plan.days" :key="day.day_index">
            <div>
              <h3 class="text-sm font-semibold text-brand-600 flex items-center gap-2 mb-2.5">
                <span class="w-5 h-5 rounded-full bg-brand-100 grid place-items-center text-[11px]" x-text="day.day_index"></span>
                <span x-text="day.date"></span>
              </h3>
              <div class="ml-3 border-l-2 border-brand-100 pl-4 space-y-2.5">
                <template x-for="item in day.items" :key="item.item_id">
                  <div class="relative">
                    <span class="absolute -left-[21px] top-1.5 w-2.5 h-2.5 rounded-full bg-white border-2 border-brand-400"></span>
                    <div class="flex items-start gap-2 flex-wrap">
                      <span class="text-xs text-ink-400 tabular-nums pt-0.5 w-11 shrink-0"
                        x-text="item.start_time ? item.start_time.slice(0,5) : '·'"></span>
                      <div class="flex-1 min-w-0">
                        <span class="text-sm font-medium" x-text="item.title"></span>
                        <span class="text-xs text-ink-400 ml-2" x-show="item.cost_cny">¥<span x-text="item.cost_cny"></span></span>
                        <p class="text-xs text-ink-500 mt-0.5" x-show="item.notes" x-text="item.notes"></p>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="snapshot">
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl border border-black/5 shadow-soft overflow-hidden">
          <div class="px-4 py-2.5 text-sm font-medium border-b border-black/5 flex items-center justify-between">
            <span>行程路线示意</span>
            <span class="text-[11px] font-normal text-ink-400">按天连线，悬停地点查看名称</span>
          </div>
          <div id="route" class="h-80 relative"></div>
          <div id="route-tooltip"
            class="hidden absolute z-10 pointer-events-none px-2.5 py-1.5 rounded-lg bg-ink-900/85 text-white text-xs shadow-soft whitespace-nowrap"></div>
        </div>
        <div class="bg-white rounded-2xl border border-black/5 shadow-soft overflow-hidden">
          <div class="px-4 py-2.5 text-sm font-medium border-b border-black/5">费用分布</div>
          <div id="cost-chart" class="h-80"></div>
        </div>
      </div>
    </template>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/share.js?v=4"></script>
{% endblock %}
