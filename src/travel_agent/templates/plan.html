{% extends "base.html" %}
{% block title %}行程详情 · 小T{% endblock %}
{% block head %}
  <script src="/static/vendor/leaflet.js"></script>
  <link rel="stylesheet" href="/static/vendor/leaflet.css" />
  <script src="/static/vendor/echarts.min.js"></script>
{% endblock %}
{% block body %}
<div class="plan-scope min-h-screen" x-data="planApp('{{ plan_id }}')">
  <header class="pj-topbar sticky top-0 z-40 h-14 flex items-center justify-between px-5">
    <a href="/" class="flex items-center gap-2.5 pj-ui">
      <img src="/static/img/logo/logo_round.png" alt="小T"
        class="w-8 h-8 rounded-full object-cover shadow-lift" />
      <span class="font-semibold text-[15px]" style="color: var(--pj-ink)">小T</span>
    </a>
    <div class="flex items-center gap-3 pj-ui">
      <span class="text-[11px] hidden sm:inline" style="color: var(--pj-ink-3)" x-show="plan"
        x-text="plan ? plan.destination + ' · ' + plan.travelers + ' 人' : ''"></span>
      <a href="/" class="text-xs hover:underline" style="color: var(--pj-ink-2)">返回对话</a>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-5 sm:px-6 sm:py-6">
    <template x-if="loading">
      <div class="text-center py-24 pj-ui" style="color: var(--pj-ink-3)">
        <div class="typing-dots flex gap-1.5 justify-center mb-3"><span></span><span></span><span></span></div>
        正在加载行程…
      </div>
    </template>

    <template x-if="error">
      <div class="text-center py-24 pj-ui">
        <p class="mb-3" style="color: #a83c2f" x-text="error"></p>
        <a href="/" class="text-sm underline" style="color: var(--pj-amber)">返回对话重新规划</a>
      </div>
    </template>

    <template x-if="message">
      <div class="pj-banner pj-ui mb-4" :data-kind="message.type === 'error' ? 'error' : 'ok'">
        <span x-text="message.text"></span>
        <button @click="message = null" class="text-xs opacity-60 hover:opacity-100 shrink-0">关闭</button>
      </div>
    </template>

    <template x-if="plan">
      <div class="pj-shell">

        <!-- ==================== 左栏：行程主干 ==================== -->
        <main class="min-w-0 space-y-4 pj-ui">

          <!-- 行程头 -->
          <section class="pj-card pj-hero">
            <div class="flex items-start justify-between gap-4 flex-wrap">
              <div class="min-w-0">
                <span class="pj-hero-kicker pj-ui">Itinerary</span>
                <h1 class="pj-hero-title" x-text="plan.destination"></h1>
                <p class="pj-hero-meta pj-ui"
                  x-text="`${plan.start_date} — ${plan.end_date} · 共 ${dayCount()} 天 · ${plan.travelers} 人`"></p>
              </div>
              <div class="flex items-center gap-1.5 shrink-0 pj-ui" id="plan-actions">
                <template x-if="!editing">
                  <div class="flex items-center gap-1.5 flex-wrap justify-end">
                    <button @click="startEdit()" class="pj-btn">编辑行程</button>
                    <button @click="showOptimize = !showOptimize" class="pj-btn">AI 优化</button>
                    <button @click="exportPdf()" :disabled="exporting" class="pj-btn"
                      x-text="exporting ? '导出中…' : '导出 PDF'"></button>
                    <button @click="share()" :disabled="sharing" class="pj-btn"
                      x-text="sharing ? '生成中…' : '分享'"></button>
                  </div>
                </template>
                <template x-if="editing">
                  <div class="flex items-center gap-1.5">
                    <button @click="saveEdit()" :disabled="saving" class="pj-btn pj-btn--primary"
                      x-text="saving ? '保存中…' : '保存修改'"></button>
                    <button @click="cancelEdit()" :disabled="saving" class="pj-btn">取消</button>
                  </div>
                </template>
              </div>
            </div>

            <!-- 收据式费用摘要 -->
            <div class="pj-ledger pj-ui">
              <div class="pj-ledger-cell pj-ledger-cell--accent">
                <div class="pj-ledger-k">人均预算</div>
                <div class="pj-ledger-v">¥<span x-text="plan.per_person_cost_cny"></span></div>
              </div>
              <div class="pj-ledger-cell">
                <div class="pj-ledger-k">总花费</div>
                <div class="pj-ledger-v">¥<span x-text="plan.total_cost_cny"></span></div>
              </div>
              <div class="pj-ledger-cell">
                <div class="pj-ledger-k" x-text="plan.budget_cny ? '预算余额' : '行程预算'"></div>
                <div class="pj-ledger-v" :style="budgetStyle()">
                  <span x-text="plan.budget_cny ? '¥' + budgetLeft() : '未设置'"></span>
                </div>
              </div>
            </div>

            <p x-show="editing" class="pj-ui mt-3 text-[11px]" style="color: var(--pj-ink-3)">
              可调整条目、时间与费用；换酒店/换景点请用「AI 优化」（检索真实候选后重排）
            </p>
          </section>

          <!-- AI 优化面板 -->
          <template x-if="showOptimize && !editing">
            <section class="pj-card p-4 pj-ui">
              <p class="text-xs mb-2.5" style="color: var(--pj-ink-2)">
                告诉小T 想怎么调整（可选），例如「换一家靠近市中心的酒店」「第二天节奏放松一点，多留室内项目」；会检索真实候选并重新排布，生成最新方案。
              </p>
              <textarea x-model="optimizeNote" rows="2" maxlength="500" class="pj-field mb-2.5"
                placeholder="可选：填写优化说明"></textarea>
              <div class="flex items-center gap-2.5">
                <button @click="optimize()" :disabled="optimizing" class="pj-btn pj-btn--primary"
                  x-text="optimizing ? '小T 正在优化…（约 10-30 秒）' : '开始优化'"></button>
                <button @click="showOptimize = false" :disabled="optimizing" class="pj-btn">收起</button>
              </div>
            </section>
          </template>

          <!-- 天次手风琴 -->
          <section>
            <div class="flex items-center justify-between gap-3 mb-2.5 px-0.5 pj-ui">
              <h2 class="text-[13px] font-semibold" style="color: var(--pj-ink)">
                每日安排
                <span class="font-normal text-[11px] ml-1" style="color: var(--pj-ink-3)"
                  x-text="`${dayCount()} 天 · ${itemCount()} 项`"></span>
              </h2>
              <button @click="toggleAllDays()" class="pj-btn" x-show="!editing"
                x-text="allCollapsed() ? '展开全部' : '收起全部'"></button>
            </div>

            <div class="space-y-2.5">
              <template x-for="day in (editing ? draft.days : plan.days)" :key="day.day_index">
                <article class="pj-day" :class="editing ? 'pj-edit-mode' : ''"
                  :data-open="isDayOpen(day.day_index) ? 'true' : 'false'">
                  <!-- 天次头：整行可点 -->
                  <button type="button" class="pj-day-head pj-ui"
                    @click="!editing && toggleDay(day.day_index)"
                    :aria-expanded="isDayOpen(day.day_index)">
                    <span class="pj-day-num" x-text="day.day_index"></span>
                    <span class="pj-day-main">
                      <span class="pj-day-date">
                        <span x-text="weekdayOf(day.date)"></span>
                        <span class="ml-1.5 font-normal text-[13px]" style="color: var(--pj-ink-2)"
                          x-text="day.date"></span>
                      </span>
                      <span class="pj-day-sub">
                        <span x-text="(day.items || []).length + ' 项安排'"></span>
                        <span x-show="!editing && (day.items || []).length === 0"
                          style="color: var(--pj-ink-3)">暂无安排</span>
                      </span>
                    </span>
                    <span class="pj-day-sum" x-show="!editing && dayTotal(day) > 0"
                      x-text="'¥' + dayTotal(day)"></span>
                    <span class="pj-caret" x-show="!editing"></span>
                  </button>

                  <!-- 折叠体：正文区做高度动画，摘要独立在外 -->
                  <div class="pj-day-body">
                      <!-- 折叠时才显示摘要：让收起状态仍能看出当天去哪 -->
                      <div class="pj-collapse-area">
                        <div class="pj-collapse-inner">
                          <!-- 只读视图：时间轴 -->
                          <div x-show="!editing" class="pj-timeline">
                            <template x-for="item in day.items" :key="item.item_id">
                              <div class="pj-tl-row">
                                <span class="pj-tl-dot" :data-cat="item.category"></span>
                                <span class="pj-tl-time"
                                  x-text="item.start_time ? item.start_time.slice(0,5) : '·'"></span>
                                <div class="pj-tl-body">
                                  <div class="flex items-start justify-between gap-3">
                                    <div class="min-w-0">
                                      <div class="pj-tl-title" x-text="item.title"></div>
                                      <div class="pj-tl-tags">
                                        <span class="pj-tag pj-tag--muted"
                                          x-text="categoryLabel(item)"></span>
                                        <span class="pj-tag pj-tag--indoor" x-show="item.indoor">室内</span>
                                        <span class="pj-tag pj-tag--outdoor" x-show="!item.indoor">户外</span>
                                      </div>
                                      <p class="pj-tl-note" x-show="item.notes" x-text="item.notes"></p>
                                    </div>
                                    <span class="pj-tl-cost" x-show="item.cost_cny"
                                      x-text="'¥' + item.cost_cny"></span>
                                  </div>
                                </div>
                              </div>
                            </template>
                            <p x-show="day.items.length === 0" class="pj-empty">暂无安排</p>
                          </div>

                          <!-- 编辑视图 -->
                          <div x-show="editing" class="p-3 space-y-2.5">
                            <template x-for="(item, idx) in day.items" :key="item.item_id">
                              <div class="pj-edit-item space-y-2">
                                <div class="flex items-center gap-2">
                                  <span class="pj-tag pj-tag--muted shrink-0" x-text="categoryLabel(item)"></span>
                                  <input x-model="item.title" placeholder="条目标题" class="pj-field flex-1 min-w-0" />
                                  <button @click="removeItem(day, idx)" type="button"
                                    class="text-xs shrink-0" style="color: #a83c2f">删除</button>
                                </div>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                  <label class="block">
                                    <span class="pj-field-label">开始</span>
                                    <input type="time" x-model="item.start_time" class="pj-field" />
                                  </label>
                                  <label class="block">
                                    <span class="pj-field-label">结束</span>
                                    <input type="time" x-model="item.end_time" class="pj-field" />
                                  </label>
                                  <label class="block">
                                    <span class="pj-field-label">时长(分)</span>
                                    <input type="number" min="0" max="1440" x-model.number="item.duration_min" class="pj-field" />
                                  </label>
                                  <label class="block">
                                    <span class="pj-field-label">费用(¥)</span>
                                    <input type="number" min="0" x-model.number="item.cost_cny" class="pj-field" />
                                  </label>
                                </div>
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 items-end">
                                  <label class="flex items-center gap-1.5 text-xs" style="color: var(--pj-ink-2)">
                                    <input type="checkbox" x-model="item.indoor" class="rounded" /> 室内项目
                                  </label>
                                  <label class="block">
                                    <span class="pj-field-label">到下一站交通</span>
                                    <select x-model="item.travel_mode_to_next" class="pj-field">
                                      <option value="">未指定</option>
                                      <option value="walking">步行</option>
                                      <option value="transit">公交/地铁</option>
                                      <option value="driving">驾车</option>
                                    </select>
                                  </label>
                                </div>
                                <input x-model="item.notes" placeholder="备注" class="pj-field" />
                              </div>
                            </template>
                            <p x-show="day.items.length === 0" class="pj-empty">暂无安排，点击下方按钮添加</p>
                            <button @click="addItem(day)" type="button" class="pj-btn"
                              style="color: var(--pj-amber); border-color: #e6d3b4">＋ 添加活动 / 备注</button>
                          </div>
                        </div>
                      </div>

                      <!-- 摘要：仅收起时显示（显隐由 CSS 依 data-open 控制） -->
                      <p class="pj-collapsed-peek"
                        x-text="daySummary(day) || '暂无安排'"></p>
                  </div>
                </article>
              </template>
            </div>
          </section>

          <!-- 本次变更 -->
          <template x-if="lastDiff">
            <section class="pj-card p-4 pj-ui">
              <h3 class="text-[13px] font-semibold mb-2" style="color: var(--pj-ink)">本次变更</h3>
              <ul class="space-y-1">
                <template x-for="(line, i) in diffLines()" :key="i">
                  <li class="text-xs" :class="line.cls" x-text="line.text"></li>
                </template>
              </ul>
              <p x-show="diffLines().length === 0" class="text-xs" style="color: var(--pj-ink-3)">本版本与上一版本内容一致</p>
              <p x-show="diffOverflow() > 0" class="text-xs mt-1" style="color: var(--pj-ink-3)">
                … 另有 <span x-text="diffOverflow()"></span> 处变更
              </p>
              <template x-if="lastWarnings.length > 0">
                <div class="mt-3 pt-2" style="border-top: 1px solid var(--pj-line-2)">
                  <p class="text-xs font-medium text-amber-600 mb-1">待关注（程序化自检）</p>
                  <ul class="list-disc list-inside space-y-0.5">
                    <template x-for="(warning, i) in lastWarnings.slice(0, 6)" :key="i">
                      <li class="text-xs text-amber-600" x-text="warning"></li>
                    </template>
                  </ul>
                </div>
              </template>
            </section>
          </template>
        </main>

        <!-- ==================== 右栏：辅助信息 ==================== -->
        <aside class="pj-rail min-w-0 space-y-4 pj-ui" x-show="plan && !editing">

          <section class="pj-card overflow-hidden">
            <div class="pj-card-head">
              <div class="min-w-0">
                <span class="pj-card-title">行程路线</span>
                <p class="text-[10.5px] mt-0.5" style="color: var(--pj-ink-3)"
                  x-text="mapView === 'real' ? '真实地理坐标，悬停节点查看地点' : '示意图，仅表示方位与先后顺序'"></p>
              </div>
              <div class="pj-viewswitch">
                <button @click="mapView !== 'real' && toggleMapView()"
                  :data-on="mapView === 'real'">真实地图</button>
                <button @click="mapView !== 'sketch' && toggleMapView()"
                  :data-on="mapView === 'sketch'">手绘示意</button>
              </div>
            </div>
            <div id="route"></div>
            <div id="route-legend" x-show="mapView === 'sketch'"></div>
          </section>

          <section class="pj-card overflow-hidden">
            <div class="pj-card-head">
              <div class="min-w-0">
                <span class="pj-card-title">住宿推荐</span>
                <p class="text-[10.5px] mt-0.5" style="color: var(--pj-ink-3)"
                  x-text="hotelData ? hotelMeta : '按位置与行程匹配，三档可选'"></p>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <label class="text-[10.5px] flex items-center gap-1" style="color: var(--pj-ink-3)">
                  人数
                  <input type="number" min="1" max="50" x-model.number="hotelTravelers"
                    class="pj-field !w-12 !py-0.5 !px-1.5 !text-[11px] tabular-nums" />
                </label>
                <button @click="loadHotels()" :disabled="hotelLoading" class="pj-btn pj-btn--accent"
                  x-text="hotelLoading ? '查询中…' : (hotelData ? '换一批' : '推荐酒店')"></button>
              </div>
            </div>

            <div class="p-3">
              <p x-show="hotelError" class="text-xs" style="color: #a83c2f" x-text="hotelError"></p>

              <template x-if="!hotelData && !hotelError">
                <div class="py-5 text-center">
                  <p class="text-xs mb-2.5" style="color: var(--pj-ink-3)">
                    按行程位置推荐<strong style="color: var(--pj-ink-2)">性价比 / 轻奢 / 高奢</strong>各一处，并按人数推断房型
                  </p>
                  <button @click="loadHotels()" :disabled="hotelLoading" class="pj-btn pj-btn--primary"
                    x-text="hotelLoading ? '查询中…' : '获取住宿推荐'"></button>
                </div>
              </template>

              <template x-if="hotelData">
                <div>
                  <!-- 房型建议 -->
                  <div class="pj-room-note mb-3">
                    <p class="text-[11.5px] font-semibold mb-1.5" style="color: #8a5a1c"
                      x-text="`按 ${hotelData.travelers} 人入住 ${hotelData.nights} 晚的房型建议`"></p>
                    <template x-for="(s, i) in hotelData.room_suggestions" :key="i">
                      <div class="flex items-start gap-2 py-0.5">
                        <span class="pj-tag shrink-0" :class="i === 0 ? 'pj-btn--accent !text-white !border-0' : 'pj-tag--muted'"
                          x-text="i === 0 ? '主推' : '备选'"></span>
                        <div class="min-w-0">
                          <p class="text-[11.5px]" style="color: var(--pj-ink)"
                            x-text="`${s.rooms} 间${roomLabel(s.room_type)}（每间 ${s.occupancy} 人）`"></p>
                          <p class="text-[10.5px]" style="color: var(--pj-ink-3)" x-text="s.rationale"></p>
                        </div>
                      </div>
                    </template>
                  </div>

                  <!-- 三档 -->
                  <div class="space-y-2.5">
                    <template x-for="tier in hotelData.tiers" :key="tier.tier">
                      <div class="pj-tier" :data-tier="tier.tier">
                        <div class="flex items-baseline justify-between gap-2 mb-1">
                          <span class="text-[13px] font-semibold" style="color: var(--pj-ink)"
                            x-text="tier.label"></span>
                          <span class="text-[10px] px-1.5 py-0.5 rounded"
                            :style="tierBadge(tier.tier)"
                            x-text="tier.hotels.length + ' 家可选'"></span>
                        </div>
                        <p class="text-[10.5px] mb-2" style="color: var(--pj-ink-3)" x-text="tier.description"></p>

                        <p x-show="tier.hotels.length === 0" class="text-[11px] py-2"
                          style="color: var(--pj-ink-3)">目的地暂无该档次住宿</p>

                        <template x-for="h in tier.hotels" :key="h.hotel_id">
                          <div class="pj-hotel">
                            <p class="text-xs font-medium leading-snug" style="color: var(--pj-ink)"
                              x-text="h.name"></p>
                            <div class="flex items-center gap-2 mt-1 flex-wrap text-[10px]" style="color: var(--pj-ink-3)">
                              <span x-show="h.categories.length" x-text="h.categories[h.categories.length - 1]"></span>
                              <span x-show="h.rating" style="color: #b8860b"
                                x-text="h.rating ? `评分 ${h.rating}` : ''"></span>
                              <span x-show="h.distance_m !== null"
                                x-text="h.distance_m !== null ? `距行程 ${(h.distance_m / 1000).toFixed(1)}km` : ''"></span>
                            </div>
                            <div class="mt-1.5">
                              <template x-if="h.prices.length > 0">
                                <p class="text-xs tabular-nums" style="color: var(--pj-amber)">
                                  <span x-text="`¥${Math.round(h.prices[0].nightly_cny)}`"></span><span
                                    class="text-[10px]" style="color: var(--pj-ink-3)">/晚参考</span>
                                  <span class="text-[10px] ml-1" style="color: var(--pj-ink-3)"
                                    x-text="`${hotelData.nights}晚约 ¥${h.prices[0].total_cny}`"></span>
                                </p>
                              </template>
                              <p x-show="h.prices.length === 0" class="text-[10px]" style="color: var(--pj-ink-3)">暂无报价</p>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>

                  <p class="text-[10.5px] mt-2.5 leading-relaxed" style="color: var(--pj-ink-3)"
                    x-text="hotelData.disclaimer"></p>
                </div>
              </template>
            </div>
          </section>

          <section class="pj-card overflow-hidden" x-show="!editing">
            <div class="pj-card-head">
              <span class="pj-card-title">费用分布</span>
              <span class="text-[10.5px]" style="color: var(--pj-ink-3)"
                x-text="'合计 ¥' + plan.total_cost_cny"></span>
            </div>
            <div id="cost-chart"></div>
          </section>

          <section class="pj-card p-4" x-show="versions.length > 0">
            <h3 class="text-[13px] font-semibold mb-1" style="color: var(--pj-ink)">版本历史</h3>
            <template x-for="v in versions" :key="v.version">
              <div class="flex items-center justify-between gap-3 py-2 text-sm"
                style="border-bottom: 1px solid var(--pj-line-2)">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="shrink-0" style="color: var(--pj-ink-2)">v<span x-text="v.version"></span></span>
                  <span class="text-xs truncate" style="color: var(--pj-ink-3)"
                    x-show="v.trigger_snippet" x-text="v.trigger_snippet"></span>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                  <span class="text-[11px] tabular-nums" style="color: var(--pj-ink-3)"
                    x-text="fmtTime(v.created_at)"></span>
                  <button @click="rollback(v.version)" class="text-xs hover:underline"
                    style="color: var(--pj-amber)">回滚</button>
                </div>
              </div>
            </template>
          </section>
        </aside>
      </div>
    </template>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/sketch-map.js?v=4"></script>
<script src="/static/js/plan.js?v=11"></script>
{% endblock %}
