{% extends "base.html" %}
{% block title %}行程详情 · 小T{% endblock %}
{% block head %}
  <script src="/static/vendor/leaflet.js"></script>
  <link rel="stylesheet" href="/static/vendor/leaflet.css" />
  <script src="/static/vendor/echarts.min.js"></script>
{% endblock %}
{% block body %}
<div x-data="planApp('{{ plan_id }}')">
  <header class="h-14 flex items-center justify-between px-5 bg-white/80 backdrop-blur border-b border-black/5">
    <a href="/" class="flex items-center gap-2.5">
      <img src="/static/img/logo/logo_round.png" alt="小T"
        class="w-8 h-8 rounded-full object-cover shadow-lift" />
      <span class="font-semibold text-[15px]">小T</span>
    </a>
    <a href="/" class="text-xs text-ink-500 hover:text-brand-600">返回对话</a>
  </header>

  <div class="max-w-3xl mx-auto px-4 py-6 space-y-4">
    <template x-if="loading">
      <div class="text-center text-ink-400 py-20">
        <div class="typing-dots flex gap-1.5 justify-center mb-3"><span></span><span></span><span></span></div>
        正在加载行程…
      </div>
    </template>

    <template x-if="error">
      <div class="text-center py-20">
        <p class="text-red-500 mb-3" x-text="error"></p>
        <a href="/" class="text-sm text-brand-600 hover:underline">返回对话重新规划</a>
      </div>
    </template>

    <template x-if="message">
      <div class="flex items-start justify-between gap-3 rounded-xl px-4 py-3 text-sm border"
        :class="message.type === 'error' ? 'bg-red-50 border-red-100 text-red-600' : 'bg-emerald-50 border-emerald-100 text-emerald-700'">
        <span x-text="message.text"></span>
        <button @click="message = null" class="text-xs opacity-60 hover:opacity-100 shrink-0">关闭</button>
      </div>
    </template>

    <template x-if="plan">
      <div class="bg-white/75 backdrop-blur-xl rounded-2xl border border-white/60 shadow-soft p-6">
        <div class="flex items-start justify-between gap-4 mb-4">
          <div>
            <h1 class="text-xl font-bold" x-text="plan.destination"></h1>
            <p class="text-sm text-ink-500 mt-1" x-text="plan.start_date + ' ~ ' + plan.end_date + ' · ' + plan.travelers + ' 人'"></p>
          </div>
          <div class="text-right shrink-0">
            <p class="text-lg font-bold text-brand-600">人均约 ¥<span x-text="plan.per_person_cost_cny"></span></p>
            <p class="text-xs text-ink-400">总花费 ¥<span x-text="plan.total_cost_cny"></span><span x-show="plan.budget_cny"> · 预算 ¥<span x-text="plan.budget_cny"></span></span></p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 mb-4">
          <template x-if="!editing">
            <div class="flex items-center gap-2">
              <button @click="startEdit()"
                class="text-xs px-3 py-1.5 rounded-lg border border-black/10 text-ink-600 hover:border-brand-300 hover:text-brand-600">编辑行程</button>
              <button @click="showOptimize = !showOptimize"
                class="text-xs px-3 py-1.5 rounded-lg border border-brand-300 text-brand-600 hover:bg-brand-50">AI 优化</button>
              <button @click="exportPdf()" :disabled="exporting"
                class="text-xs px-3 py-1.5 rounded-lg border border-black/10 text-ink-600 hover:border-brand-300 hover:text-brand-600"
                x-text="exporting ? '导出中…' : '导出 PDF'"></button>
              <button @click="share()" :disabled="sharing"
                class="text-xs px-3 py-1.5 rounded-lg border border-black/10 text-ink-600 hover:border-brand-300 hover:text-brand-600"
                x-text="sharing ? '生成中…' : '分享'"></button>
            </div>
          </template>
          <template x-if="editing">
            <div class="flex items-center gap-2">
              <button @click="saveEdit()" :disabled="saving"
                class="text-xs px-4 py-1.5 rounded-lg bg-brand-600 text-white disabled:opacity-50"
                x-text="saving ? '保存中…' : '保存修改'"></button>
              <button @click="cancelEdit()" :disabled="saving"
                class="text-xs px-3 py-1.5 rounded-lg border border-black/10 text-ink-500 hover:text-ink-700">取消</button>
            </div>
          </template>
          <span x-show="editing" class="text-[11px] text-ink-400">可调整条目、时间与费用；换酒店/换景点请用「AI 优化」（检索真实候选后重排）</span>
        </div>

        <template x-if="showOptimize && !editing">
          <div class="mb-4 rounded-xl border border-brand-200 bg-brand-50/60 p-3.5 space-y-2.5">
            <p class="text-xs text-ink-500">告诉小T 想怎么调整（可选），例如「换一家靠近市中心的酒店」「第二天节奏放松一点，多留室内项目」；会检索真实候选并重新排布，生成最新方案。</p>
            <textarea x-model="optimizeNote" rows="2" maxlength="500"
              class="w-full rounded-lg border border-black/10 px-3 py-2 text-sm focus:border-brand-400 focus:outline-none bg-white"
              placeholder="可选：填写优化说明"></textarea>
            <div class="flex items-center gap-3">
              <button @click="optimize()" :disabled="optimizing"
                class="text-xs px-4 py-1.5 rounded-lg bg-brand-600 text-white disabled:opacity-50"
                x-text="optimizing ? '小T 正在优化…（约 10-30 秒）' : '开始优化'"></button>
              <button @click="showOptimize = false" :disabled="optimizing" class="text-xs text-ink-400 hover:text-ink-600">收起</button>
            </div>
          </div>
        </template>

        <div class="space-y-5">
          <template x-for="day in (editing ? draft.days : plan.days)" :key="day.day_index">
            <div>
              <h3 class="text-sm font-semibold text-brand-600 flex items-center gap-2 mb-2.5">
                <span class="w-5 h-5 rounded-full bg-brand-100 grid place-items-center text-[11px]" x-text="day.day_index"></span>
                <span x-text="day.date"></span>
                <span class="text-[11px] font-normal text-ink-400 ml-auto" x-show="!editing && dayTotal(day) > 0">本日合计 <span class="font-medium text-ink-600">¥<span x-text="dayTotal(day)"></span></span></span>
              </h3>

              <div x-show="!editing" class="ml-3 border-l-2 border-brand-100 pl-4 space-y-2.5">
                <template x-for="item in day.items" :key="item.item_id">
                  <div class="relative">
                    <span class="absolute -left-[21px] top-1.5 w-2.5 h-2.5 rounded-full bg-white border-2 border-brand-400"></span>
                    <div class="flex items-start gap-2 flex-wrap">
                      <span class="text-xs text-ink-400 tabular-nums pt-0.5 w-11 shrink-0"
                        x-text="item.start_time ? item.start_time.slice(0,5) : '·'"></span>
                      <div class="flex-1 min-w-0">
                        <span class="text-sm font-medium" x-text="item.title"></span>
                        <span class="text-xs text-ink-400 ml-2" x-show="item.cost_cny">¥<span x-text="item.cost_cny"></span></span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded ml-1.5 align-middle"
                          :class="item.indoor ? 'bg-blue-50 text-blue-600' : 'bg-green-50 text-green-600'"
                          x-text="item.indoor ? '室内' : '户外'"></span>
                        <p class="text-xs text-ink-500 mt-0.5" x-show="item.notes" x-text="item.notes"></p>
                      </div>
                    </div>
                  </div>
                </template>
                <p x-show="day.items.length === 0" class="text-xs text-ink-400">暂无安排</p>
              </div>

              <div x-show="editing" class="ml-3 border-l-2 border-brand-100 pl-4 space-y-2.5">
                <template x-for="(item, idx) in day.items" :key="item.item_id">
                  <div class="rounded-xl border border-black/10 bg-ink-50/40 p-3 space-y-2">
                    <div class="flex items-center gap-2">
                      <span class="text-[10px] px-1.5 py-0.5 rounded bg-white border border-black/10 text-ink-500 shrink-0"
                        x-text="categoryLabel(item)"></span>
                      <input x-model="item.title" placeholder="条目标题"
                        class="flex-1 min-w-0 rounded-lg border border-black/10 px-2.5 py-1.5 text-sm bg-white focus:border-brand-400 focus:outline-none"/>
                      <button @click="removeItem(day, idx)"
                        class="text-xs text-red-500 hover:text-red-600 shrink-0">删除</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                      <label class="block">
                        <span class="text-[10px] text-ink-400">开始</span>
                        <input type="time" x-model="item.start_time"
                          class="w-full rounded-lg border border-black/10 px-2 py-1 text-sm bg-white focus:border-brand-400 focus:outline-none"/>
                      </label>
                      <label class="block">
                        <span class="text-[10px] text-ink-400">结束</span>
                        <input type="time" x-model="item.end_time"
                          class="w-full rounded-lg border border-black/10 px-2 py-1 text-sm bg-white focus:border-brand-400 focus:outline-none"/>
                      </label>
                      <label class="block">
                        <span class="text-[10px] text-ink-400">时长(分)</span>
                        <input type="number" min="0" max="1440" x-model.number="item.duration_min"
                          class="w-full rounded-lg border border-black/10 px-2 py-1 text-sm bg-white focus:border-brand-400 focus:outline-none"/>
                      </label>
                      <label class="block">
                        <span class="text-[10px] text-ink-400">费用(¥)</span>
                        <input type="number" min="0" x-model.number="item.cost_cny"
                          class="w-full rounded-lg border border-black/10 px-2 py-1 text-sm bg-white focus:border-brand-400 focus:outline-none"/>
                      </label>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 items-center">
                      <label class="flex items-center gap-1.5 text-xs text-ink-600">
                        <input type="checkbox" x-model="item.indoor" class="rounded border-black/20"/> 室内项目
                      </label>
                      <label class="block">
                        <span class="text-[10px] text-ink-400">到下一站交通</span>
                        <select x-model="item.travel_mode_to_next"
                          class="w-full rounded-lg border border-black/10 px-2 py-1 text-sm bg-white focus:border-brand-400 focus:outline-none">
                          <option value="">未指定</option>
                          <option value="walking">步行</option>
                          <option value="transit">公交/地铁</option>
                          <option value="driving">驾车</option>
                        </select>
                      </label>
                    </div>
                    <input x-model="item.notes" placeholder="备注"
                      class="w-full rounded-lg border border-black/10 px-2.5 py-1.5 text-sm bg-white focus:border-brand-400 focus:outline-none"/>
                  </div>
                </template>
                <p x-show="day.items.length === 0" class="text-xs text-ink-400">暂无安排，点击下方按钮添加</p>
                <button @click="addItem(day)"
                  class="text-xs text-brand-600 hover:text-brand-700">＋ 添加活动 / 备注</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="lastDiff">
      <div class="bg-white/75 backdrop-blur-xl rounded-2xl border border-white/60 shadow-soft p-4">
        <h3 class="text-sm font-medium mb-2">本次变更</h3>
        <ul class="space-y-1">
          <template x-for="(line, i) in diffLines()" :key="i">
            <li class="text-xs" :class="line.cls" x-text="line.text"></li>
          </template>
        </ul>
        <p x-show="diffLines().length === 0" class="text-xs text-ink-400">本版本与上一版本内容一致</p>
        <p x-show="diffOverflow() > 0" class="text-xs text-ink-400 mt-1">… 另有 <span x-text="diffOverflow()"></span> 处变更</p>
        <template x-if="lastWarnings.length > 0">
          <div class="mt-3 border-t border-black/5 pt-2">
            <p class="text-xs font-medium text-amber-600 mb-1">待关注（程序化自检）</p>
            <ul class="list-disc list-inside space-y-0.5">
              <template x-for="(warning, i) in lastWarnings.slice(0, 6)" :key="i">
                <li class="text-xs text-amber-600" x-text="warning"></li>
              </template>
            </ul>
          </div>
        </template>
      </div>
    </template>

    <template x-if="plan && !editing">
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white/75 backdrop-blur-xl rounded-2xl border border-white/60 shadow-soft overflow-hidden">
          <div class="px-4 py-2.5 text-sm font-medium border-b border-black/5 flex items-center justify-between">
            <span>行程路线地图</span>
            <span class="text-[11px] font-normal text-ink-400">真实地理坐标，悬停节点查看地点</span>
          </div>
          <div id="route" class="h-80 relative z-0"></div>
        </div>
        <div class="bg-white/75 backdrop-blur-xl rounded-2xl border border-white/60 shadow-soft overflow-hidden">
          <div class="px-4 py-2.5 text-sm font-medium border-b border-black/5">费用分布</div>
          <div id="cost-chart" class="h-80"></div>
        </div>
      </div>
    </template>

    <div x-show="versions.length > 0" class="bg-white/75 backdrop-blur-xl rounded-2xl border border-white/60 shadow-soft p-4">
      <h3 class="text-sm font-medium mb-1">版本历史</h3>
      <template x-for="v in versions" :key="v.version">
        <div class="flex items-center justify-between gap-3 py-2 border-b border-black/5 last:border-0 text-sm">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-ink-700 shrink-0">v<span x-text="v.version"></span></span>
            <span class="text-xs text-ink-400 truncate" x-show="v.trigger_snippet" x-text="v.trigger_snippet"></span>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <span class="text-[11px] text-ink-400 tabular-nums" x-text="fmtTime(v.created_at)"></span>
            <button @click="rollback(v.version)"
              class="text-xs text-brand-600 hover:text-brand-700 hover:underline">回滚到此版本</button>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/plan.js?v=8"></script>
{% endblock %}
