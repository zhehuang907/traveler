name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      # 集成测试依赖 127.0.0.1:3306 的 MySQL（root/1234，见 tests/conftest.py）；
      # MYSQL_DATABASE 自动建出测试库 travel_agent_test（测试只在库内建表，不建库）
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: travel_agent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 安装依赖
        run: uv sync

      # doctor 集成检查（test_doctor.py::test_main_exit_zero）用默认配置连 travel_agent 库，
      # 库不存在时 check_mysql 报 FAIL、main 返回 1 导致测试失败，故先建出该库
      - name: 创建业务数据库（doctor 默认检查库）
        run: |
          uv run python - <<'PY'
          import pymysql

          conn = pymysql.connect(host="127.0.0.1", port=3306, user="root", password="1234")
          with conn.cursor() as cur:
              cur.execute(
                  "CREATE DATABASE IF NOT EXISTS travel_agent "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              )
          conn.commit()
          conn.close()
          PY

      - name: Ruff 检查
        run: uv run ruff check .

      - name: Ruff 格式校验
        run: uv run ruff format --check .

      - name: mypy 严格类型检查
        run: uv run mypy

      - name: pytest（含覆盖率）
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=70
