name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      # 集成测试依赖 127.0.0.1:3306 的 MySQL（root/1234，见 tests/conftest.py）；
      # MYSQL_DATABASE 自动建出测试库 travel_agent_test（测试只在库内建表，不建库）
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: travel_agent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 安装依赖
        run: uv sync

      - name: Ruff 检查
        run: uv run ruff check .

      - name: Ruff 格式校验
        run: uv run ruff format --check .

      - name: mypy 严格类型检查
        run: uv run mypy

      - name: pytest（含覆盖率）
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=70
