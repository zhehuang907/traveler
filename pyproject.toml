[project]
name = "travel-agent"
version = "0.1.0"
description = "智能旅游规划 Agent：自然语言生成可溯源、可视化、可多轮修改的行程单"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Travel Agent Contributors" }]
keywords = ["travel", "agent", "langgraph", "fastapi", "llm"]
dependencies = [
    # ---- Web / 接口层 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # ---- 配置 / 模型 ----
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # ---- 日志 ----
    "loguru>=0.7",
    "structlog>=24.4",
    # ---- HTTP / 韧性 ----
    "httpx>=0.27",
    "tenacity>=9.0",
    # ---- Agent 编排 ----
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # ---- 前端渲染 ----
    "jinja2>=3.1",
    # ---- 数据层 ----
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    # MySQL 异步驱动（纯 Python，兼容 py3.13）+ Alembic 同步驱动 + 密码哈希
    # pymysql[rsa]：MySQL 8 默认 caching_sha2_password 认证需 cryptography（RSA 加密密码）
    "aiomysql>=0.2.0",
    "pymysql[rsa]>=1.1",
    "bcrypt>=4.1",
    "alembic>=1.13",
    # ---- 能力层 ----
    "diskcache>=5.6",
    "trafilatura>=1.12",
    "duckduckgo-search>=6.0",
    "python-docx>=1.2.0",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
# PDF 导出依赖较重，按需安装：uv sync --extra pdf
pdf = ["playwright>=1.45"]

[dependency-groups]
dev = [
    # 上限锁定：ruff 跨大版本会调整规则集与默认行为（如 UP038 曾由稳定降为 preview），
    # 不锁上限会导致 CI 与本地/lock 解析出不同版本，出现「本地过、CI 挂」的假失败
    "ruff>=0.16,<0.17",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.8",
]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

# ============================ Ruff ============================
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ASYNC",# async 误用
    "S",    # bandit 安全
    "C4",   # comprehension 优化
    "PIE",  # misc lints
    "SIM",  # 简化建议
    "RUF",  # ruff 专属
]
# B008: FastAPI 的 Depends()/Query() 作为默认参数是官方推荐写法
# RUF001/002/003: 中文项目的中文标点/歧义字符属正常情况
# 注：UP038（isinstance 元组→X|Y）在 ruff 0.7+ 已被移除并降为 preview 规则，
#     故不再需要 ignore；代码统一使用 X | Y 写法
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S101 测试允许 assert；S104 测试用例需要 0.0.0.0 字面量；S106 测试连接本地库的固定口令
"tests/**/*.py" = ["S101", "S104", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["travel_agent"]

# ============================ mypy ============================
[tool.mypy]
python_version = "3.13"
mypy_path = ["src", "tests/integration"]
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# tests/ 与 tests/integration/ 下都有 conftest.py 且不使用 __init__.py（pytest 根目录插入模式）
explicit_package_bases = true
namespace_packages = true

# 第三方库缺少 py.typed 时的豁免（按实际安装情况维护）
[[tool.mypy.overrides]]
module = ["trafilatura.*", "duckduckgo_search.*", "diskcache.*", "pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
warn_return_any = true

# ============================ pytest ============================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
source = ["src/travel_agent"]
branch = true
parallel = true

[tool.coverage.paths]
travel_agent = ["src/travel_agent", "*/site-packages/travel_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
