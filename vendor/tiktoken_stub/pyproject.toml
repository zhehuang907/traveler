[project]
name = "tiktoken"
version = "0.14.0"
description = "纯 Python 实现的 tiktoken 替身（规避 Windows 应用程序控制策略对原生扩展的拦截）"
requires-python = ">=3.13"
# 依赖刻意为空：替身只用标准库 re，确保在任何环境都能导入
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiktoken"]
