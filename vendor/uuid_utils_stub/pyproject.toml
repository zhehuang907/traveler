[project]
name = "uuid-utils"
version = "0.17.1"
description = "纯 Python 实现的 uuid-utils 替身（规避 Windows 应用程序控制策略对原生扩展的拦截）"
requires-python = ">=3.13"
# 依赖刻意为空：替身只用标准库，确保在任何环境都能导入
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uuid_utils"]