# pre-commit 钩子：uv run pre-commit install 后生效
# 注意：ruff-pre-commit 的 rev 必须与 pyproject.toml 的 ruff 约束、uv.lock 中的实际版本保持一致，
#       否则 pre-commit / CI / 本地 lint 三方会给出互相矛盾的结果（历史上曾因 rev 停在 v0.6.9 而误报 UP038）
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest (unit)
        entry: uv run pytest tests/unit
        language: system
        pass_filenames: false
        stages: [manual]
